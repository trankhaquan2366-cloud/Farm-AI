services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Bắt buộc đặt SECRET_KEY trong .env/shell; không dùng khóa mặc định.
      SECRET_KEY: ${SECRET_KEY:?Dat SECRET_KEY trong .env hoac bien moi truong}
      DEBUG: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # app/core/database.py đọc DATABASE_URL (không phải SQLALCHEMY_DATABASE_URL).
      DATABASE_URL: sqlite:///./farm.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    volumes:
      - ./farm.db:/app/farm.db
    networks:
      - farm-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # frontend/lib/api.ts tự thêm "/api"; đặt /api/v1 ở đây sẽ thành /api/v1/api.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - farm-network

networks:
  farm-network:
    name: farm-network
    driver: bridge