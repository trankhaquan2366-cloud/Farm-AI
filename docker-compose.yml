services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-replace-this-secret-before-deployment}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SQLALCHEMY_DATABASE_URL: sqlite:///./farm.db
    volumes:
      - ./farm.db:/app/farm.db
    networks:
      - farm-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - farm-network

networks:
  farm-network:
    name: farm-network
    driver: bridge