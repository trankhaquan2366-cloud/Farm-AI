version: '3.8'

services:
  backend:
    build: ./farm_backend
    ports:
      - "8000:8000"
    env_file:
      - ./farm_backend/.env
    volumes:
      - ./farm_backend/farm.db:/app/farm.db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend  /.env
    depends_on:
      - backend